  "scenes": [
    {
      "id": "B01-001",
      "block_id": "B01",
      "number": 1,
      "goal": "real Meser/service context",
      "start_offset": 0,
      "end_offset": 450,
      "narration": "Привет. Позвольте представить вам несколько новых возможностей для служащих, доступных на сайте Мэсэр в соответствующем разделе.\n\nНа сайте Мэсэр собрана полезная информация и материалы для членов сообщества. Кроме того, в разделе «Для служащих» находятся дополнительные инструменты, доступные служащим группы Мэсэр, например Google Диск и Google Календарь.\n\nТеперь к ним добавились инструменты, связанные с записью и обработкой спикерских собраний.\n\n",
      "captions": []
    },
    {
      "id": "B01-002",
      "block_id": "B01",
      "number": 2,
      "goal": "Zoom→processing→site/announcement relation",
      "start_offset": 450,
      "end_offset": 1902,
      "narration": "Как вам известно, наша группа ведёт запись спикерских собраний, которые проходят в Zoom.\n\nОбычно после собрания запись нужно подготовить: отредактировать начало и конец, по возможности устранить проблемы, связанные с разницей в громкости голосов участников, убрать мешающие частоты, после чего готовая запись добавляется на сайт «Нам по пути».\n\nДля человека, знакомого с обработкой аудио, такая работа обычно не представляет большой сложности. Но для обычного пользователя она практически недоступна без специальных программ и определённого опыта.\n\nКроме того, эта же запись используется анонс-мейкером, который прослушивает спикерскую, выделяет основные мысли и готовит короткое текстовое резюме для анонса.\n\nПри этом анонс-мейкеру приходится прослушивать довольно длинную двуязычную запись целиком, стараясь игнорировать голос оригинала, который занимает половину времени записи. С таким подходом тратится гораздо больше времени и теряется фокус внимания.\n\nУчитывая недостатки нынешнего подхода, на портале Мэсэр появились две новые функции, которые значительно упрощают эти два процесса.\n\nДля анонс-мейкера появилась возможность значительно сократить длительность записи за счёт того, что в её конечной версии остаётся только голос переводчика.\n\nА для подготовки финальной версии спикерской появились простые инструменты редактирования, которыми сможет пользоваться служащий даже без опыта работы в профессиональных программах для обработки звука.\n\n",
      "captions": []
    },
    {
      "id": "B01-003",
      "block_id": "B01",
      "number": 3,
      "goal": "real entry to Audio Editor.",
      "start_offset": 1902,
      "end_offset": 1993,
      "narration": "Обе новые функции доступны в разделе «Редактирование аудио»: «Анонс-мейкер» и «Спикерская».",
      "captions": []
    },
    {
      "id": "B02-004",
      "block_id": "B02",
      "number": 4,
      "goal": "common→multitrack",
      "start_offset": 0,
      "end_offset": 565,
      "narration": "Чтобы понять, как работают новые функции, важно упомянуть об одной полезной возможности Zoom.\n\nДля нашей задачи важно различать два варианта записи Zoom.\n\nОба режима доступны как при записи Zoom на компьютер, так и при записи в облако, доступной в учётной записи Zoom.\n\nВ первом режиме запись производится одним общим аудиофайлом, в котором слышны все участники.\n\nВо втором режиме звук участников сохраняется на отдельных дорожках: например, отдельно спикера, переводчика и других участников. Начало и конец каждой дорожки синхронизированы между собой по времени.\n\n",
      "captions": []
    },
    {
      "id": "B02-005",
      "block_id": "B02",
      "number": 5,
      "goal": "translator-only gaps",
      "start_offset": 565,
      "end_offset": 1102,
      "narration": "Запись в режиме отдельных дорожек для каждого участника даёт несколько важных преимуществ.\n\nНапример, для подготовки анонса можно использовать только дорожку русского переводчика.\n\nСпикер и переводчик обычно говорят по очереди, поэтому, оставляя только дорожку переводчика, мы услышим длинные участки тишины — это фразы спикера, которые не попали в дорожку переводчика. Их можно автоматически сократить и получить гораздо более короткую запись, которую гораздо удобнее слушать из-за уменьшения времени записи и отсутствия второго языка. ",
      "captions": []
    },
    {
      "id": "B02-006",
      "block_id": "B02",
      "number": 6,
      "goal": "silence contraction",
      "start_offset": 1102,
      "end_offset": 1666,
      "narration": "Анонс-мейкер, владеющий ивритом, может совершить обратный процесс, выбрав в конечной записи только дорожку спикера.\n\nРаздельные дорожки также будут полезны при подготовке финальной версии спикерской, которая будет сохранена на сайте «Нам по пути».\n\nУ одного участника звук может быть слишком тихим, у другого — слишком громким. На одной дорожке может появиться гул, кашель или посторонний шум.\n\nКогда звук всех участников находится в одном общем файле, исправить проблемы, связанные с одним участником, не затронув звук остальных участников, значительно сложнее.\n\n",
      "captions": []
    },
    {
      "id": "B02-007",
      "block_id": "B02",
      "number": 7,
      "goal": "per-track/global problem concepts.",
      "start_offset": 1666,
      "end_offset": 2284,
      "narration": "При раздельной записи каждую дорожку можно обрабатывать отдельно: улучшить звук конкретного участника, выровнять громкость или убрать помеху только там, где она появилась.\n\nЕсли в запись попал ненужный участник, его дорожку можно исключить из готовой версии.\n\nЕсли проблема относится сразу ко всей записи — например, произошла техническая проблема, остановка спикерской, переводчик временно отключился, ненужный участок времени можно убрать одновременно на всех дорожках.\nТаким образом, запись Zoom с использованием отдельных дорожек для каждого участника становится основой для двух новых инструментов редактирования.",
      "captions": []
    },
    {
      "id": "B03-008",
      "block_id": "B03",
      "number": 8,
      "goal": "source section",
      "start_offset": 0,
      "end_offset": 293,
      "narration": "Итак, у нас имеется запись собрания в виде отдельных дорожек для каждого участника.\n\nМы их можем взять с того устройства, на котором производилась запись (например, тот самый компьютер, где запись была активирована), либо из облачного хранилища Zoom, доступного для владельца учётной записи.\n\n",
      "captions": []
    },
    {
      "id": "B03-009",
      "block_id": "B03",
      "number": 9,
      "goal": "device/archive source choices.",
      "start_offset": 293,
      "end_offset": 486,
      "narration": "Если же кто-то до вас уже загрузил запись в Аудиоархив на портале Мэсэр, вы можете воспользоваться ей без надобности самим загружать файлы. Этот вариант будет подробнее показан в третьей части.",
      "captions": []
    },
    {
      "id": "B04-010",
      "block_id": "B04",
      "number": 10,
      "goal": "real workflow-choice cards and opening Announcement.",
      "start_offset": 0,
      "end_offset": 126,
      "narration": "После выбора дорожек нам доступны два режима: «Анонс-мейкер» или «Спикерская».\nДавайте сперва рассмотрим режим «Анонс-мейкер».",
      "captions": []
    },
    {
      "id": "B05-011",
      "block_id": "B05",
      "number": 11,
      "goal": "track selection",
      "start_offset": 0,
      "end_offset": 304,
      "narration": "Здесь мы можем выбрать дорожки, которые нам понадобятся для подготовки анонса. В самом простом случае это дорожка одного русского переводчика.\nЕсли же переводчиков двое и больше — например, один переводит саму спикерскую, а второй вопросы и ответы, — нам понадобятся все доступные дорожки переводчиков.\n\n",
      "captions": []
    },
    {
      "id": "B05-012",
      "block_id": "B05",
      "number": 12,
      "goal": "Solo/Mute",
      "start_offset": 304,
      "end_offset": 570,
      "narration": "Перед обработкой их также можно прослушать и проверить.\n\nФункция Solo, обозначенная английской буквой S, позволяет прослушивать только ту дорожку, где эта функция активирована, а функция Mute, обозначенная буквой M, позволяет отключить звук соответствующей дорожки. ",
      "captions": []
    },
    {
      "id": "B05-013",
      "block_id": "B05",
      "number": 13,
      "goal": "remove X",
      "start_offset": 570,
      "end_offset": 927,
      "narration": "Обратите внимание, что на конечный результат эти функции не влияют. Они существуют только для удобства прослушивания при редактировании. Если даже одна из дорожек не воспроизводится из-за нажатого Mute, она всё равно попадёт в конечный обработанный файл.\nЕсли вы ошиблись и добавили ненужную аудиодорожку, её можно удалить, использовав кнопку со значком X.\n",
      "captions": []
    },
    {
      "id": "B05-014",
      "block_id": "B05",
      "number": 14,
      "goal": "close/reopen recovery.",
      "start_offset": 927,
      "end_offset": 1172,
      "narration": "Если нужная дорожка была удалена по ошибке, можно воспользоваться кнопкой «Закрыть работу», а затем снова открыть режим Анонс-мейкера, используя кнопку «Открыть анонс-мейкер». В этом случае все изначально выбранные дорожки записи будут доступны.",
      "captions": []
    },
    {
      "id": "B06-015",
      "block_id": "B06",
      "number": 15,
      "goal": "run processing",
      "start_offset": 0,
      "end_offset": 308,
      "narration": "После выбора нужных дорожек кнопка «Обработать запись» запускает обработку.\n\nВ процессе обработки происходит следующее: алгоритм автоматически находит длинные участки, где на всех выбранных дорожках одновременно присутствует тишина, и сокращает их, оставляя небольшой естественный промежуток между фразами.\n\n",
      "captions": []
    },
    {
      "id": "B06-016",
      "block_id": "B06",
      "number": 16,
      "goal": "common-silence animation",
      "start_offset": 308,
      "end_offset": 464,
      "narration": "Если в этот момент хотя бы на одной дорожке есть сигнал, этот участок не сокращается.\n\nПосле обработки выбранные дорожки объединяются в один готовый файл.\n\n",
      "captions": []
    },
    {
      "id": "B06-017",
      "block_id": "B06",
      "number": 17,
      "goal": "real result/reprocess",
      "start_offset": 464,
      "end_offset": 691,
      "narration": "Если при обработке были выбраны не те дорожки — например, нужная дорожка отсутствовала или была добавлена лишняя, — можно применить необходимые правки и запустить обработку снова. В результате будет создан новый готовый файл.\n\n",
      "captions": []
    },
    {
      "id": "B06-018",
      "block_id": "B06",
      "number": 18,
      "goal": "download/archive-save affordances.",
      "start_offset": 691,
      "end_offset": 914,
      "narration": "По завершении процесса файл доступен к скачиванию в виде MP3. Кроме того, вы можете сохранить его в архиве портала, где он будет привязан к данной записи и будет доступен для скачивания позже — вами, либо другими служащими.",
      "captions": []
    },
    {
      "id": "B07-019",
      "block_id": "B07",
      "number": 19,
      "goal": "open Speaker",
      "start_offset": 0,
      "end_offset": 488,
      "narration": "Теперь рассмотрим второй режим — «Спикерская».\n\nОн предназначен для подготовки полноценной финальной записи собрания, которая затем может быть размещена на сайте «Нам по пути».\n\nВ этом режиме все выбранные дорожки остаются отдельными на протяжении всей работы и объединяются только при создании готового файла.\n\nБлагодаря этому мы можем отдельно работать со звуком каждого участника.\n\nДля каждой дорожки доступны три вида обработки: улучшение звука, выравнивание громкости и компрессия.\n\n",
      "captions": []
    },
    {
      "id": "B07-020",
      "block_id": "B07",
      "number": 20,
      "goal": "enhancement/leveling/compression",
      "start_offset": 488,
      "end_offset": 908,
      "narration": "Функция улучшения звука помогает ослабить низкий гул и лишние высокие частоты.\n\nВыравнивание громкости полезно в тех случаях, когда один участник записан заметно тише или громче остальных.\n\nКомпрессия уменьшает разницу между тихими и громкими фрагментами речи в рамках одной и той же дорожки. Для неё можно выбрать лёгкую, среднюю или сильную степень обработки.\n\nВсе эти настройки доступны отдельно для каждой дорожки.\n\n",
      "captions": []
    },
    {
      "id": "B07-021",
      "block_id": "B07",
      "number": 21,
      "goal": "Solo/Mute",
      "start_offset": 908,
      "end_offset": 1434,
      "narration": "Как и в режиме «Анонс-мейкер», здесь доступны функции Solo и Mute.\n\nОни работают точно так же: Solo позволяет при прослушивании оставить только выбранную дорожку, а Mute — временно отключить её звук.\n\nИ здесь эти функции также влияют только на прослушивание и не изменяют конечный результат.\n\nНо в режиме «Спикерская» появляется ещё одна важная возможность.\n\nЕсли какая-то дорожка вообще не должна попасть в готовую запись — например, это дорожка случайно подключившегося участника, — её можно исключить из финального микса.\n\n",
      "captions": []
    },
    {
      "id": "B07-022",
      "block_id": "B07",
      "number": 22,
      "goal": "exclude/restore mix.",
      "start_offset": 1434,
      "end_offset": 1862,
      "narration": "В отличие от Mute, такое отключение уже влияет на конечный файл: звук этой дорожки не попадёт в готовую спикерскую.\n\nПри этом сама исходная дорожка не удаляется. Если решение изменится, её в любой момент можно снова вернуть в финальный микс.\n\nВ режиме «Анонс-мейкер» ненужную дорожку мы просто убирали из числа доступных дорожек. В «Спикерской» она остаётся частью проекта, но её можно включать или исключать из конечной записи.",
      "captions": []
    },
    {
      "id": "B08-023",
      "block_id": "B08",
      "number": 23,
      "goal": "color/order",
      "start_offset": 0,
      "end_offset": 277,
      "narration": "Все дорожки расположены на общей временной шкале и синхронизированы между собой по времени.\n\nДля удобства работы каждой дорожке можно назначить свой цвет, а также изменить порядок их расположения на экране. Это не изменяет их положение во времени и не нарушает синхронизацию.\n\n",
      "captions": []
    },
    {
      "id": "B08-024",
      "block_id": "B08",
      "number": 24,
      "goal": "fullscreen",
      "start_offset": 277,
      "end_offset": 547,
      "narration": "При необходимости рабочую область можно развернуть на весь экран.\n\nДля более точной работы с записью можно изменять горизонтальный масштаб временной шкалы: увеличить его, чтобы подробнее рассмотреть небольшой участок, или уменьшить, чтобы увидеть большую часть записи.\n\n",
      "captions": []
    },
    {
      "id": "B08-025",
      "block_id": "B08",
      "number": 25,
      "goal": "time zoom/Fit",
      "start_offset": 547,
      "end_offset": 889,
      "narration": "Кнопка «Вписать» возвращает всю запись в доступную ширину.\n\nЭтот же регулятор можно переключить в режим изменения высоты дорожек. Это удобно, если нужно разместить на экране больше дорожек одновременно или, наоборот, сделать их крупнее.\n\nПри минимальной высоте дорожек часть элементов управления скрывается, чтобы освободить место на экране. ",
      "captions": []
    },
    {
      "id": "B08-026",
      "block_id": "B08",
      "number": 26,
      "goal": "height compact/expanded visibility",
      "start_offset": 889,
      "end_offset": 1140,
      "narration": "В частности, становятся скрыты ползунок компрессии и индикаторы уровня громкости. При увеличении высоты дорожек эти элементы снова отображаются.\n\nПри включённой функции Follow экран автоматически перемещается вслед за текущим местом воспроизведения.\n\n",
      "captions": []
    },
    {
      "id": "B08-027",
      "block_id": "B08",
      "number": 27,
      "goal": "Follow/Loop.",
      "start_offset": 1140,
      "end_offset": 1434,
      "narration": "А функция Loop позволяет выделить нужный участок и прослушивать его по кругу. Это удобно, когда один и тот же фрагмент нужно несколько раз проверить перед редактированием.\n\nВсе эти функции предназначены для удобства просмотра и прослушивания записи и сами по себе не изменяют готовый аудиофайл.",
      "captions": []
    },
    {
      "id": "B09-028",
      "block_id": "B09",
      "number": 28,
      "goal": "tool-first global cut",
      "start_offset": 0,
      "end_offset": 298,
      "narration": "Теперь перейдём непосредственно к монтажу записи.\n\nДля удаления ненужных фрагментов доступны два инструмента: «Вырезать» и «Тишина».\n\nЗдесь важно соблюдать порядок действий: сначала выбирается нужный инструмент, а затем прямо на форме звуковой волны отмечается фрагмент, который нужно обработать.\n\n",
      "captions": []
    },
    {
      "id": "B09-029",
      "block_id": "B09",
      "number": 29,
      "goal": "tool-first track silence",
      "start_offset": 298,
      "end_offset": 641,
      "narration": "Если ненужный участок относится сразу ко всем дорожкам — например, произошла техническая остановка собрания или появилась длинная пауза из-за проблем со связью, — выбирается инструмент «Вырезать».\n\nПосле этого нужный фрагмент отмечается на любой из дорожек. При отпускании кнопки мыши этот участок будет вырезан одновременно со всех дорожек.\n\n",
      "captions": []
    },
    {
      "id": "B09-030",
      "block_id": "B09",
      "number": 30,
      "goal": "draggable start/end boundaries",
      "start_offset": 641,
      "end_offset": 950,
      "narration": "Обратите внимание, что фрагмент, выделенный этой функцией, вырезается не только из готовой версии, но и из воспроизведения в редакторе.\n\nЕсли же проблема присутствует только на одной конкретной дорожке — например, там слышен посторонний разговор или другой мешающий звук, — используется инструмент «Тишина».\n\n",
      "captions": []
    },
    {
      "id": "B09-031",
      "block_id": "B09",
      "number": 31,
      "goal": "drag existing region edge",
      "start_offset": 950,
      "end_offset": 1216,
      "narration": "В этом случае фрагмент отмечается непосредственно на той дорожке, звук которой нужно убрать. На остальных дорожках этот участок остаётся без изменений.\n\nНачало и конец готовой записи задаются отдельно.\n\nНа звуковой волне находятся два маркера — «Начало» и «Конец».\n\n",
      "captions": []
    },
    {
      "id": "B09-032",
      "block_id": "B09",
      "number": 32,
      "goal": "numeric existing-region edit",
      "start_offset": 1216,
      "end_offset": 1558,
      "narration": "Чтобы изменить границы готовой записи, достаточно перетащить соответствующий маркер в нужное место.\n\nВсё, что находится до маркера «Начало» и после маркера «Конец», не попадёт в готовую версию спикерской.\n\nПосле создания выреза или участка тишины его границы можно изменить прямо на временной шкале, захватив соответствующий край выделения.\n\n",
      "captions": []
    },
    {
      "id": "B09-033",
      "block_id": "B09",
      "number": 33,
      "goal": "restore cut/silence",
      "start_offset": 1558,
      "end_offset": 1771,
      "narration": "Если требуется более точное редактирование, точные значения границ можно также указать вручную с помощью числовых полей.\n\nЧтобы отменить вырез или тишину, нужно сперва выбрать соответствующий выделенный фрагмент. ",
      "captions": []
    },
    {
      "id": "B09-034",
      "block_id": "B09",
      "number": 34,
      "goal": "Undo/Redo.",
      "start_offset": 1771,
      "end_offset": 2118,
      "narration": "При этом кнопка «Вырезать» становится кнопкой «Снять вырез», а кнопка «Тишина» — кнопкой «Снять тишину», в зависимости от того, какой фрагмент был выбран.\n\nПосле нажатия соответствующей кнопки эта правка снимается.\n\nКроме того, доступны функции «Отменить» и «Повторить», позволяющие вернуться на шаг назад или снова применить отменённое изменение.",
      "captions": []
    },
    {
      "id": "B10-035",
      "block_id": "B10",
      "number": 35,
      "goal": "render final",
      "start_offset": 0,
      "end_offset": 302,
      "narration": "После завершения монтажа можно создать готовый файл, нажав кнопку «Создать финальную версию».\n\nРедактор применит все выбранные настройки обработки и сделанные правки, исключит ненужные дорожки и объединит остальные в один готовый MP3-файл.\n\nПосле завершения обработки появится финальная версия записи. ",
      "captions": []
    },
    {
      "id": "B10-036",
      "block_id": "B10",
      "number": 36,
      "goal": "result/stats",
      "start_offset": 302,
      "end_offset": 606,
      "narration": "Её можно прослушать непосредственно в редакторе и при необходимости проверить результат перед сохранением.\n\nЗдесь же отображается длительность исходной записи, длительность готового файла, сколько времени было удалено при монтаже, а также размер готового MP3.\n\nГотовый файл можно скачать на устройство.\n\n",
      "captions": []
    },
    {
      "id": "B10-037",
      "block_id": "B10",
      "number": 37,
      "goal": "listen/download/archive prerequisite.",
      "start_offset": 606,
      "end_offset": 884,
      "narration": "Кроме того, финальную версию можно сохранить в Аудиоархиве портала Мэсэр. Для этого сначала должен быть сохранён текущий проект обработки.\n\nКак сохраняются проекты, финальные версии и исходные записи и как затем открыть их с другого устройства, будет показано в следующей части.",
      "captions": []
    },
    {
      "id": "B11-038",
      "block_id": "B11",
      "number": 38,
      "goal": "archive role overlay",
      "start_offset": 0,
      "end_offset": 482,
      "narration": "Теперь перейдём к Аудиоархиву.\n\nИспользовать Аудиоархив необязательно. Например, если нужно просто отредактировать запись на том устройстве, где доступны её файлы, и быстро получить результат для скачивания.\n\nНо если требуется дополнительная гибкость и мобильность в работе служащего либо разделение задач между служащими, Аудиоархив будет максимально полезен.\n\nОн позволяет хранить исходные записи Zoom, результаты обработки и проекты спикерских непосредственно на портале Мэсэр.\n\n",
      "captions": []
    },
    {
      "id": "B11-039",
      "block_id": "B11",
      "number": 39,
      "goal": "create metadata",
      "start_offset": 482,
      "end_offset": 825,
      "narration": "Это, в частности, позволяет передавать работу между служащими и продолжать её с другого устройства.\n\nНапример, один служащий получил запись Zoom с отдельными дорожками участников, а обработкой записи будет заниматься другой.\n\nВместо того чтобы отдельно пересылать ему все файлы, первый служащий может сохранить исходные дорожки в Аудиоархиве. ",
      "captions": []
    },
    {
      "id": "B11-040",
      "block_id": "B11",
      "number": 40,
      "goal": "add/replace files",
      "start_offset": 825,
      "end_offset": 1295,
      "narration": "После этого другой служащий сможет открыть эту же запись непосредственно через портал Мэсэр.\n\nДругой возможный сценарий — служащий загрузил файлы сразу после записи с одного компьютера, а через несколько дней продолжил работу над ними с другого.\n\nЧтобы добавить новую запись в Архив, используется кнопка «Создать запись».\n\nСначала указывается название записи.\n\nПри необходимости можно также указать дату и время собрания.\n\nПосле этого выбираются исходные дорожки Zoom.\n\n",
      "captions": []
    },
    {
      "id": "B11-041",
      "block_id": "B11",
      "number": 41,
      "goal": "save record.",
      "start_offset": 1295,
      "end_offset": 1715,
      "narration": "Если при выборе файлов какая-то дорожка была пропущена, её можно добавить с помощью кнопки «Добавить дорожки».\n\nЕсли же были выбраны неправильные файлы, кнопка «Выбрать заново» позволяет заменить весь выбранный список.\n\nДо сохранения можно проверить список выбранных файлов и их общий размер.\n\nПосле нажатия «Сохранить запись» исходные дорожки загружаются в Аудиоархив, и созданная запись становится доступна на портале.",
      "captions": []
    },
    {
      "id": "B12-042",
      "block_id": "B12",
      "number": 42,
      "goal": "save local record to archive",
      "start_offset": 0,
      "end_offset": 314,
      "narration": "Сохранить исходную запись в Аудиоархив можно не только непосредственно из самого Архива.\n\nЕсли работа уже была начата в Аудиоредакторе с файлами, находящимися на устройстве, там также доступна кнопка «Сохранить запись Zoom в аудиоархив».\n\nТаким образом, нет необходимости заранее решать, понадобится ли вам Архив. ",
      "captions": []
    },
    {
      "id": "B12-043",
      "block_id": "B12",
      "number": 43,
      "goal": "archive workflow section",
      "start_offset": 314,
      "end_offset": 593,
      "narration": "Можно начать обычную обработку локальных файлов, а при необходимости сохранить исходную запись в Архив уже в процессе работы.\n\nРаботает это и в обратную сторону.\n\nУже сохранённую запись можно открыть в Аудиоредакторе прямо из Аудиоархива.\n\nДля этого нужно открыть нужную запись. ",
      "captions": []
    },
    {
      "id": "B12-044",
      "block_id": "B12",
      "number": 44,
      "goal": "announcement/speaker actions",
      "start_offset": 593,
      "end_offset": 991,
      "narration": "В разделе «Что сделать с этой записью?» доступны два варианта: подготовить её для анонса или обработать спикерскую.\n\nКнопка «Открыть анонс-мейкер» открывает эту запись в соответствующем режиме Аудиоредактора.\n\nДля спикерской, если проект обработки ещё не создавался, используется «Начать обработку». Если же сохранённый проект уже существует, вместо этого будет предложено «Продолжить обработку».\n\n",
      "captions": []
    },
    {
      "id": "B12-045",
      "block_id": "B12",
      "number": 45,
      "goal": "real archive↔editor navigation.",
      "start_offset": 991,
      "end_offset": 1260,
      "narration": "Есть и другой путь: находясь непосредственно в Аудиоредакторе, можно выбрать вариант «Из аудиоархива», найти нужную запись и открыть её оттуда.\n\nВ обоих случаях используются сохранённые в Архиве исходные дорожки, поэтому повторно загружать их с устройства не требуется.",
      "captions": []
    },
    {
      "id": "B13-046",
      "block_id": "B13",
      "number": 46,
      "goal": "announcement versions",
      "start_offset": 0,
      "end_offset": 501,
      "narration": "После обработки записи в режиме «Анонс-мейкер» готовый MP3 можно не только скачать на устройство, но и сохранить в Аудиоархиве.\n\nСохранённый результат остаётся связан с той же исходной записью Zoom и отображается внутри неё как отдельная версия для анонс-мейкера.\n\nЕсли позднее эту же запись обработать ещё раз — например, выбрать другой состав дорожек или получить новый результат, — его можно сохранить как следующую версию.\n\nПредыдущая версия при этом не заменяется и остаётся доступной в Архиве.\n\n",
      "captions": []
    },
    {
      "id": "B13-047",
      "block_id": "B13",
      "number": 47,
      "goal": "save Speaker project/local-source dialog",
      "start_offset": 501,
      "end_offset": 1007,
      "narration": "Таким образом, у одной исходной записи может храниться несколько готовых версий для анонс-мейкера.\n\nКаждую из них позже можно прослушать или скачать непосредственно из Аудиоархива.\n\nВ режиме «Спикерская» в Аудиоархиве можно сохранить не только готовый MP3, но и сам проект обработки.\n\nПроект хранит текущее состояние работы: установленные границы начала и конца записи, вырезанные участки, участки тишины на отдельных дорожках, исключённые из готовой версии дорожки и выбранные настройки обработки звука.\n\n",
      "captions": []
    },
    {
      "id": "B13-048",
      "block_id": "B13",
      "number": 48,
      "goal": "project history states",
      "start_offset": 1007,
      "end_offset": 1515,
      "narration": "Сохранённый проект можно позже снова открыть и продолжить работу с того же места.\nНапример, если в записи слишком много проблематичных мест на одной из дорожек, либо было несколько случаев разрыва связи, которые нужно вырезать полностью из всех дорожек, обработку можно разделить на несколько сеансов, всякий раз сохраняя новое состояние проекта.\n\nПри этом исходные дорожки загружаются из Аудиоархива вместе с сохранёнными настройками и правками, поэтому повторно выбирать файлы на устройстве не требуется.\n\n",
      "captions": []
    },
    {
      "id": "B13-049",
      "block_id": "B13",
      "number": 49,
      "goal": "continue old state",
      "start_offset": 1515,
      "end_offset": 1964,
      "narration": "Если работа была начата с локальных файлов и исходная Zoom-запись ещё не сохранена в Архиве, при первом сохранении проекта будет предложено сохранить одновременно и исходные дорожки, и сам проект.\n\nКаждое новое сохранение проекта создаёт новое состояние в его истории.\n\nПредыдущие состояния при этом не перезаписываются и остаются доступными.\n\nПоэтому при необходимости можно открыть более раннее состояние проекта и продолжить работу уже от него.\n\n",
      "captions": []
    },
    {
      "id": "B13-050",
      "block_id": "B13",
      "number": 50,
      "goal": "final↔state association",
      "start_offset": 1964,
      "end_offset": 2469,
      "narration": "Это может быть полезно, например, если после нескольких изменений вы решили вернуться к одному из предыдущих вариантов монтажа.\n\nПосле завершения обработки спикерской готовый MP3 можно скачать на устройство или сохранить в Аудиоархиве как финальную версию.\n\nКаждая такая версия остаётся связана с конкретным сохранённым состоянием проекта, из которого она была создана.\n\nЭто означает, что если позже продолжить работу над проектом и внести новые изменения, уже сохранённая финальная версия не изменится.\n\n",
      "captions": []
    },
    {
      "id": "B13-051",
      "block_id": "B13",
      "number": 51,
      "goal": "continue editing from final.",
      "start_offset": 2469,
      "end_offset": 3019,
      "narration": "После новых правок можно сохранить очередное состояние проекта, снова создать готовый MP3 и сохранить его как следующую финальную версию спикерской.\n\nТаким образом, в Аудиоархиве могут одновременно храниться несколько готовых версий одной и той же спикерской, созданных на разных этапах работы.\n\nКаждую сохранённую версию можно прослушать или скачать непосредственно из Аудиоархива.\n\nКроме того, при необходимости можно выбрать одну из финальных версий и продолжить редактирование именно с того состояния проекта, на основе которого она была создана.",
      "captions": []
    },
    {
      "id": "B14-052",
      "block_id": "B14",
      "number": 52,
      "goal": "search",
      "start_offset": 0,
      "end_offset": 642,
      "narration": "Чтобы найти ранее сохранённую запись, в Аудиоархиве используется кнопка «Показать записи».\n\nЗапись можно найти по её названию или по имени одной из исходных дорожек. Также можно ограничить поиск определённым месяцем.\n\nПри необходимости доступны дополнительные фильтры — например, можно показать только записи, для которых сохранён проект спикерской, версии для анонс-мейкера или финальные версии спикерской.\n\nПосле открытия нужной записи в одном месте доступны все связанные с ней материалы.\n\nЗдесь можно увидеть исходные дорожки, готовые версии для анонс-мейкера и спикерской, а также сохранённый проект спикерской и историю его состояний.\n\n",
      "captions": []
    },
    {
      "id": "B14-053",
      "block_id": "B14",
      "number": 53,
      "goal": "month/additional filters",
      "start_offset": 642,
      "end_offset": 1143,
      "narration": "Последние готовые версии доступны в разделе «Готовые записи».\n\nОстальные сохранённые версии находятся в разделе «Все версии и управление».\n\nИстория сохранений спикерской находится в разделе «Проект обработки спикерской».\n\nТаким образом, все материалы, относящиеся к одному собранию, остаются связаны с одной исходной записью Zoom, и их не приходится искать отдельно в разных местах.\n\nИтак, подведём итог.\n\nУпомянутые инструменты позволяют существенно упростить работу с записями спикерских собраний.\n\n",
      "captions": []
    },
    {
      "id": "B14-054",
      "block_id": "B14",
      "number": 54,
      "goal": "record detail sections + summary + closing.",
      "start_offset": 1143,
      "end_offset": 1816,
      "narration": "Использование отдельных дорожек Zoom даёт возможность работать со звуком каждого участника отдельно и использовать одну и ту же исходную запись для разных задач.\n\nАнонс-мейкер может получить более короткую запись на нужном языке, автоматически сократив длинные паузы.\n\nВ режиме «Спикерская» можно обработать звук отдельных участников, выполнить необходимый монтаж и создать готовую финальную запись.\n\nА Аудиоархив позволяет сохранить исходные дорожки, результаты и проекты обработки, чтобы продолжить работу позже, с другого устройства или передать её другому служащему.\n\nЭти возможности сделают подготовку записей спикерских собраний проще и удобнее.\n\nСпасибо за внимание.",
      "captions": []
    }
  ],
