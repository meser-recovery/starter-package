      "canonical_start_offset": 1995,
      "canonical_end_offset": 4279,
      "scene_ids": [
        "B02-004",
        "B02-005",
        "B02-006",
        "B02-007"
      ],
      "narration": "Чтобы понять, как работают новые функции, важно упомянуть об одной полезной возможности Zoom.\n\nДля нашей задачи важно различать два варианта записи Zoom.\n\nОба режима доступны как при записи Zoom на компьютер, так и при записи в облако, доступной в учётной записи Zoom.\n\nВ первом режиме запись производится одним общим аудиофайлом, в котором слышны все участники.\n\nВо втором режиме звук участников сохраняется на отдельных дорожках: например, отдельно спикера, переводчика и других участников. Начало и конец каждой дорожки синхронизированы между собой по времени.\n\nЗапись в режиме отдельных дорожек для каждого участника даёт несколько важных преимуществ.\n\nНапример, для подготовки анонса можно использовать только дорожку русского переводчика.\n\nСпикер и переводчик обычно говорят по очереди, поэтому, оставляя только дорожку переводчика, мы услышим длинные участки тишины — это фразы спикера, которые не попали в дорожку переводчика. Их можно автоматически сократить и получить гораздо более короткую запись, которую гораздо удобнее слушать из-за уменьшения времени записи и отсутствия второго языка. Анонс-мейкер, владеющий ивритом, может совершить обратный процесс, выбрав в конечной записи только дорожку спикера.\n\nРаздельные дорожки также будут полезны при подготовке финальной версии спикерской, которая будет сохранена на сайте «Нам по пути».\n\nУ одного участника звук может быть слишком тихим, у другого — слишком громким. На одной дорожке может появиться гул, кашель или посторонний шум.\n\nКогда звук всех участников находится в одном общем файле, исправить проблемы, связанные с одним участником, не затронув звук остальных участников, значительно сложнее.\n\nПри раздельной записи каждую дорожку можно обрабатывать отдельно: улучшить звук конкретного участника, выровнять громкость или убрать помеху только там, где она появилась.\n\nЕсли в запись попал ненужный участник, его дорожку можно исключить из готовой версии.\n\nЕсли проблема относится сразу ко всей записи — например, произошла техническая проблема, остановка спикерской, переводчик временно отключился, ненужный участок времени можно убрать одновременно на всех дорожках.\nТаким образом, запись Zoom с использованием отдельных дорожек для каждого участника становится основой для двух новых инструментов редактирования.",
      "pronunciation_dictionary_locators": []
