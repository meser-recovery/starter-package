      "narration": "Теперь перейдём к Аудиоархиву.\n\nИспользовать Аудиоархив необязательно. Например, если нужно просто отредактировать запись на том устройстве, где доступны её файлы, и быстро получить результат для скачивания.\n\nНо если требуется дополнительная гибкость и мобильность в работе служащего либо разделение задач между служащими, Аудиоархив будет максимально полезен.\n\nОн позволяет хранить исходные записи Zoom, результаты обработки и проекты спикерских непосредственно на портале Мэсэр.\n\nЭто, в частности, позволяет передавать работу между служащими и продолжать её с другого устройства.\n\nНапример, один служащий получил запись Zoom с отдельными дорожками участников, а обработкой записи будет заниматься другой.\n\nВместо того чтобы отдельно пересылать ему все файлы, первый служащий может сохранить исходные дорожки в Аудиоархиве. После этого другой служащий сможет открыть эту же запись непосредственно через портал Мэсэр.\n\nДругой возможный сценарий — служащий загрузил файлы сразу после записи с одного компьютера, а через несколько дней продолжил работу над ними с другого.\n\nЧтобы добавить новую запись в Архив, используется кнопка «Создать запись».\n\nСначала указывается название записи.\n\nПри необходимости можно также указать дату и время собрания.\n\nПосле этого выбираются исходные дорожки Zoom.\n\nЕсли при выборе файлов какая-то дорожка была пропущена, её можно добавить с помощью кнопки «Добавить дорожки».\n\nЕсли же были выбраны неправильные файлы, кнопка «Выбрать заново» позволяет заменить весь выбранный список.\n\nДо сохранения можно проверить список выбранных файлов и их общий размер.\n\nПосле нажатия «Сохранить запись» исходные дорожки загружаются в Аудиоархив, и созданная запись становится доступна на портале.",
