      "narration": "Привет. Позвольте представить вам несколько новых возможностей для служащих, доступных на сайте Мэсэр в соответствующем разделе.\n\nНа сайте Мэсэр собрана полезная информация и материалы для членов сообщества. Кроме того, в разделе «Для служащих» находятся дополнительные инструменты, доступные служащим группы Мэсэр, например Google Диск и Google Календарь.\n\nТеперь к ним добавились инструменты, связанные с записью и обработкой спикерских собраний.\n\nКак вам известно, наша группа ведёт запись спикерских собраний, которые проходят в Zoom.\n\nОбычно после собрания запись нужно подготовить: отредактировать начало и конец, по возможности устранить проблемы, связанные с разницей в громкости голосов участников, убрать мешающие частоты, после чего готовая запись добавляется на сайт «Нам по пути».\n\nДля человека, знакомого с обработкой аудио, такая работа обычно не представляет большой сложности. Но для обычного пользователя она практически недоступна без специальных программ и определённого опыта.\n\nКроме того, эта же запись используется анонс-мейкером, который прослушивает спикерскую, выделяет основные мысли и готовит короткое текстовое резюме для анонса.\n\nПри этом анонс-мейкеру приходится прослушивать довольно длинную двуязычную запись целиком, стараясь игнорировать голос оригинала, который занимает половину времени записи. С таким подходом тратится гораздо больше времени и теряется фокус внимания.\n\nУчитывая недостатки нынешнего подхода, на портале Мэсэр появились две новые функции, которые значительно упрощают эти два процесса.\n\nДля анонс-мейкера появилась возможность значительно сократить длительность записи за счёт того, что в её конечной версии остаётся только голос переводчика.\n\nА для подготовки финальной версии спикерской появились простые инструменты редактирования, которыми сможет пользоваться служащий даже без опыта работы в профессиональных программах для обработки звука.\n\nОбе новые функции доступны в разделе «Редактирование аудио»: «Анонс-мейкер» и «Спикерская».",
      "pronunciation_dictionary_locators": [],
