    {
      "id": "B05",
      "title": "Анонс-мейкер: выбираем дорожки",
      "canonical_start_offset": 4896,
      "canonical_end_offset": 6068,
      "scene_ids": [
        "B05-011",
        "B05-012",
        "B05-013",
        "B05-014"
      ],
      "narration": "Здесь мы можем выбрать дорожки, которые нам понадобятся для подготовки анонса. В самом простом случае это дорожка одного русского переводчика.\nЕсли же переводчиков двое и больше — например, один переводит саму спикерскую, а второй вопросы и ответы, — нам понадобятся все доступные дорожки переводчиков.\n\nПеред обработкой их также можно прослушать и проверить.\n\nФункция Solo, обозначенная английской буквой S, позволяет прослушивать только ту дорожку, где эта функция активирована, а функция Mute, обозначенная буквой M, позволяет отключить звук соответствующей дорожки. Обратите внимание, что на конечный результат эти функции не влияют. Они существуют только для удобства прослушивания при редактировании. Если даже одна из дорожек не воспроизводится из-за нажатого Mute, она всё равно попадёт в конечный обработанный файл.\nЕсли вы ошиблись и добавили ненужную аудиодорожку, её можно удалить, использовав кнопку со значком X.\nЕсли нужная дорожка была удалена по ошибке, можно воспользоваться кнопкой «Закрыть работу», а затем снова открыть режим Анонс-мейкера, используя кнопку «Открыть анонс-мейкер». В этом случае все изначально выбранные дорожки записи будут доступны.",
      "pronunciation_dictionary_locators": []
    },
    {
      "id": "B06",
      "title": "Анонс-мейкер: сокращаем паузы",
      "canonical_start_offset": 6070,
      "canonical_end_offset": 6984,
      "scene_ids": [
        "B06-015",
        "B06-016",
        "B06-017",
        "B06-018"
      ],
      "narration": "После выбора нужных дорожек кнопка «Обработать запись» запускает обработку.\n\nВ процессе обработки происходит следующее: алгоритм автоматически находит длинные участки, где на всех выбранных дорожках одновременно присутствует тишина, и сокращает их, оставляя небольшой естественный промежуток между фразами.\n\nЕсли в этот момент хотя бы на одной дорожке есть сигнал, этот участок не сокращается.\n\nПосле обработки выбранные дорожки объединяются в один готовый файл.\n\nЕсли при обработке были выбраны не те дорожки — например, нужная дорожка отсутствовала или была добавлена лишняя, — можно применить необходимые правки и запустить обработку снова. В результате будет создан новый готовый файл.\n\nПо завершении процесса файл доступен к скачиванию в виде MP3. Кроме того, вы можете сохранить его в архиве портала, где он будет привязан к данной записи и будет доступен для скачивания позже — вами, либо другими служащими.",
      "pronunciation_dictionary_locators": []
