      "narration": "Чтобы найти ранее сохранённую запись, в Аудиоархиве используется кнопка «Показать записи».\n\nЗапись можно найти по её названию или по имени одной из исходных дорожек. Также можно ограничить поиск определённым месяцем.\n\nПри необходимости доступны дополнительные фильтры — например, можно показать только записи, для которых сохранён проект спикерской, версии для анонс-мейкера или финальные версии спикерской.\n\nПосле открытия нужной записи в одном месте доступны все связанные с ней материалы.\n\nЗдесь можно увидеть исходные дорожки, готовые версии для анонс-мейкера и спикерской, а также сохранённый проект спикерской и историю его состояний.\n\nПоследние готовые версии доступны в разделе «Готовые записи».\n\nОстальные сохранённые версии находятся в разделе «Все версии и управление».\n\nИстория сохранений спикерской находится в разделе «Проект обработки спикерской».\n\nТаким образом, все материалы, относящиеся к одному собранию, остаются связаны с одной исходной записью Zoom, и их не приходится искать отдельно в разных местах.\n\nИтак, подведём итог.\n\nУпомянутые инструменты позволяют существенно упростить работу с записями спикерских собраний.\n\nИспользование отдельных дорожек Zoom даёт возможность работать со звуком каждого участника отдельно и использовать одну и ту же исходную запись для разных задач.\n\nАнонс-мейкер может получить более короткую запись на нужном языке, автоматически сократив длинные паузы.\n\nВ режиме «Спикерская» можно обработать звук отдельных участников, выполнить необходимый монтаж и создать готовую финальную запись.\n\nА Аудиоархив позволяет сохранить исходные дорожки, результаты и проекты обработки, чтобы продолжить работу позже, с другого устройства или передать её другому служащему.\n\nЭти возможности сделают подготовку записей спикерских собраний проще и удобнее.\n\nСпасибо за внимание.",
