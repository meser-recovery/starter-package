    {
      "id": "002-zoom-multitrack",
      "chapter": "introduction",
      "canonical_refs": {
        "narration": [
          "n002",
          "n003"
        ],
        "storyboard": [
          "b002"
        ],
        "captions": []
      },
      "narration": "Обычно запись Zoom воспринимается как один готовый аудиофайл, в котором слышны все участники. Но Zoom позволяет сохранять звук и по-другому — отдельно записывать каждого участника.\n\nВместо одного общего файла можно получить несколько отдельных аудиодорожек: например, спикера, переводчика и других участников. Такая возможность есть как при записи Zoom на компьютер, так и при облачной записи, которая сохраняется в учётной записи Zoom.",
      "visual": {
        "type": "animation",
        "goal": "Одна общая waveform → отдельные `Спикер`, `Переводчик`, `Участник`",
        "animation": "zoom-multitrack",
        "action": null
      },
      "initial_state": "blank-canvas",
      "expected_state": "Один файл против поканальной записи",
      "assertions": [
        "animation-visible"
      ],
      "fixture_set": null,
      "dependencies": [],
      "regenerate": "on-hash-change",
      "padding": {
        "head": 0.5,
        "tail": 0.8
      },
      "target_seconds": "20–25 сек",
      "transforms": [],
      "captions": []
    },
    {
      "id": "003-announcement-benefit",
      "chapter": "introduction",
      "canonical_refs": {
        "narration": [
          "n004",
          "n005"
        ],
        "storyboard": [
          "b003"
        ],
        "captions": []
      },
      "narration": "Это даёт несколько очень практических преимуществ.\n\nНапример, анонс-мейкеру не обязательно прослушивать всю двуязычную запись. Можно оставить только русский перевод, автоматически сократить длинные паузы и получить гораздо более короткий материал, который проще прослушивать и анализировать.",
      "visual": {
        "type": "animation",
        "goal": "Общий двуязычный файл → дорожка перевода → становится короче",
        "animation": "announcement-benefit",
        "action": null
      },
      "initial_state": "blank-canvas",
      "expected_state": "Зачем это анонс-мейкеру",
      "assertions": [
        "animation-visible"
      ],
      "fixture_set": null,
      "dependencies": [],
      "regenerate": "on-hash-change",
      "padding": {
        "head": 0.5,
        "tail": 0.8
      },
      "target_seconds": "15–20 сек",
      "transforms": [],
      "captions": []
    },
    {
      "id": "004-speaker-benefit",
      "chapter": "introduction",
      "canonical_refs": {
        "narration": [
          "n006",
          "n007",
          "n008",
          "n009",
          "n010",
          "n011"
        ],
        "storyboard": [
          "b004"
        ],
        "captions": []
      },
      "narration": "Раздельные дорожки полезны и при подготовке финальной спикерской.\n\nУ разных участников часто сильно отличается качество звука: один записан слишком тихо, у другого присутствует гул, у третьего звук слишком резкий. В общем аудиофайле исправление одного голоса неизбежно затрагивает остальные.\n\nПри поканальной записи каждую дорожку можно обрабатывать отдельно: улучшать звук, выравнивать громкость и уменьшать разницу между тихими и громкими фрагментами.\n\nТак же отдельно можно убирать локальные помехи. Если переводчик кашлянул или на одной дорожке появился посторонний шум, этот участок можно заглушить, не затрагивая остальных.\n\nЕсли в собрание попал тролль или другой ненужный участник, его дорожку можно полностью исключить из готовой записи.\n\nЕсли возникли проблемы со связью и появился ненужный общий фрагмент, его можно вырезать на всех дорожках. А если запись была включена слишком рано или остановлена слишком поздно, можно точно установить её начало и конец.",
      "visual": {
        "type": "animation",
        "goal": "Разная громкость, гул, шум, кашель, тролль, connection, начало/конец",
        "animation": "speaker-benefit",
        "action": null
      },
      "initial_state": "blank-canvas",
      "expected_state": "Зачем это финальной спикерской",
      "assertions": [
        "animation-visible"
      ],
      "fixture_set": null,
      "dependencies": [],
      "regenerate": "on-hash-change",
      "padding": {
        "head": 0.5,
        "tail": 0.8
      },
      "target_seconds": "30–40 сек",
      "transforms": [],
      "captions": []
    },
    {
      "id": "005-two-tools",
      "chapter": "introduction",
      "canonical_refs": {
        "narration": [
          "n012",
          "n013",
          "n014"
        ],
        "storyboard": [
          "b005"
        ],
        "captions": []
      },
      "narration": "Для работы с такими записями используются два основных инструмента: Аудиоархив и Аудиоредактор.\n\nАудиоархив позволяет сохранить запись так, чтобы один человек мог её загрузить, а другой — позже открыть и обработать. Здесь же вместе хранятся исходники, проекты обработки и готовые версии.\n\nАудиоредактор позволяет открыть запись из Архива или непосредственно с устройства и выбрать один из двух вариантов работы: быстро подготовить материал для анонс-мейкера или выполнить полноценный монтаж спикерской.",
      "visual": {
        "type": "animation",
        "goal": "`Zoom → Архив ↔ Редактор → готовые версии`",
        "animation": "two-tools",
        "action": null
      },
      "initial_state": "blank-canvas",
      "expected_state": "Два инструмента",
      "assertions": [
        "animation-visible"
      ],
      "fixture_set": null,
      "dependencies": [],
      "regenerate": "on-hash-change",
      "padding": {
        "head": 0.5,
        "tail": 0.8
      },
      "target_seconds": "15–20 сек",
      "transforms": [],
      "captions": []
    },
