      "narration": "После обработки записи в режиме «Анонс-мейкер» готовый MP3 можно не только скачать на устройство, но и сохранить в Аудиоархиве.\n\nСохранённый результат остаётся связан с той же исходной записью Zoom и отображается внутри неё как отдельная версия для анонс-мейкера.\n\nЕсли позднее эту же запись обработать ещё раз — например, выбрать другой состав дорожек или получить новый результат, — его можно сохранить как следующую версию.\n\nПредыдущая версия при этом не заменяется и остаётся доступной в Архиве.\n\nТаким образом, у одной исходной записи может храниться несколько готовых версий для анонс-мейкера.\n\nКаждую из них позже можно прослушать или скачать непосредственно из Аудиоархива.\n\nВ режиме «Спикерская» в Аудиоархиве можно сохранить не только готовый MP3, но и сам проект обработки.\n\nПроект хранит текущее состояние работы: установленные границы начала и конца записи, вырезанные участки, участки тишины на отдельных дорожках, исключённые из готовой версии дорожки и выбранные настройки обработки звука.\n\nСохранённый проект можно позже снова открыть и продолжить работу с того же места.\nНапример, если в записи слишком много проблематичных мест на одной из дорожек, либо было несколько случаев разрыва связи, которые нужно вырезать полностью из всех дорожек, обработку можно разделить на несколько сеансов, всякий раз сохраняя новое состояние проекта.\n\nПри этом исходные дорожки загружаются из Аудиоархива вместе с сохранёнными настройками и правками, поэтому повторно выбирать файлы на устройстве не требуется.\n\nЕсли работа была начата с локальных файлов и исходная Zoom-запись ещё не сохранена в Архиве, при первом сохранении проекта будет предложено сохранить одновременно и исходные дорожки, и сам проект.\n\nКаждое новое сохранение проекта создаёт новое состояние в его истории.\n\nПредыдущие состояния при этом не перезаписываются и остаются доступными.\n\nПоэтому при необходимости можно открыть более раннее состояние проекта и продолжить работу уже