      "narration": "Теперь перейдём непосредственно к монтажу записи.\n\nДля удаления ненужных фрагментов доступны два инструмента: «Вырезать» и «Тишина».\n\nЗдесь важно соблюдать порядок действий: сначала выбирается нужный инструмент, а затем прямо на форме звуковой волны отмечается фрагмент, который нужно обработать.\n\nЕсли ненужный участок относится сразу ко всем дорожкам — например, произошла техническая остановка собрания или появилась длинная пауза из-за проблем со связью, — выбирается инструмент «Вырезать».\n\nПосле этого нужный фрагмент отмечается на любой из дорожек. При отпускании кнопки мыши этот участок будет вырезан одновременно со всех дорожек.\n\nОбратите внимание, что фрагмент, выделенный этой функцией, вырезается не только из готовой версии, но и из воспроизведения в редакторе.\n\nЕсли же проблема присутствует только на одной конкретной дорожке — например, там слышен посторонний разговор или другой мешающий звук, — используется инструмент «Тишина».\n\nВ этом случае фрагмент отмечается непосредственно на той дорожке, звук которой нужно убрать. На остальных дорожках этот участок остаётся без изменений.\n\nНачало и конец готовой записи задаются отдельно.\n\nНа звуковой волне находятся два маркера — «Начало» и «Конец».\n\nЧтобы изменить границы готовой записи, достаточно перетащить соответствующий маркер в нужное место.\n\nВсё, что находится до маркера «Начало» и после маркера «Конец», не попадёт в готовую версию спикерской.\n\nПосле создания выреза или участка тишины его границы можно изменить прямо на временной шкале, захватив соответствующий край выделения.\n\nЕсли требуется более точное редактирование, точные значения границ можно также указать вручную с помощью числовых полей.\n\nЧтобы отменить вырез или тишину, нужно сперва выбрать соответствующий выделенный фрагмент. При этом кнопка «Вырезать» становится кнопкой «Снять вырез», а кнопка «Тишина» — кнопкой «Снять тишину», в зависимости от того, какой фрагмент был выбран.\n\nПосле нажатия соответствующей кнопки эта правка снимается.\n\nКроме того, доступны функции «Отменить» и «Повторить», позволяющие вернуться на шаг назад или снова применить отменённое изменение.",
