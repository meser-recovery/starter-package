      "narration": "Начнём с Аудиоархива.\n\nЕго основная задача — разделить получение записи и её обработку.\n\nНапример, один служащий может получить поканальную запись Zoom, сохранить её в Архив и на этом закончить свою работу. Позже другой человек сможет открыть эту же запись со своего устройства и заняться обработкой.\n\nКроме того, Архив поддерживает общий порядок: всё, что относится к одному собранию, остаётся связано с одной записью.",
