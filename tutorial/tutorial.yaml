    {
      "id": "B07",
      "title": "Спикерская: обработка звука",
      "canonical_start_offset": 6986,
      "canonical_end_offset": 8848,
      "scene_ids": [
        "B07-019",
        "B07-020",
        "B07-021",
        "B07-022"
      ],
      "narration": "Теперь рассмотрим второй режим — «Спикерская».\n\nОн предназначен для подготовки полноценной финальной записи собрания, которая затем может быть размещена на сайте «Нам по пути».\n\nВ этом режиме все выбранные дорожки остаются отдельными на протяжении всей работы и объединяются только при создании готового файла.\n\nБлагодаря этому мы можем отдельно работать со звуком каждого участника.\n\nДля каждой дорожки доступны три вида обработки: улучшение звука, выравнивание громкости и компрессия.\n\nФункция улучшения звука помогает ослабить низкий гул и лишние высокие частоты.\n\nВыравнивание громкости полезно в тех случаях, когда один участник записан заметно тише или громче остальных.\n\nКомпрессия уменьшает разницу между тихими и громкими фрагментами речи в рамках одной и той же дорожки. Для неё можно выбрать лёгкую, среднюю или сильную степень обработки.\n\nВсе эти настройки доступны отдельно для каждой дорожки.\n\nКак и в режиме «Анонс-мейкер», здесь доступны функции Solo и Mute.\n\nОни работают точно так же: Solo позволяет при прослушивании оставить только выбранную дорожку, а Mute — временно отключить её звук.\n\nИ здесь эти функции также влияют только на прослушивание и не изменяют конечный результат.\n\nНо в режиме «Спикерская» появляется ещё одна важная возможность.\n\nЕсли какая-то дорожка вообще не должна попасть в готовую запись — например, это дорожка случайно подключившегося участника, — её можно исключить из финального микса.\n\nВ отличие от Mute, такое отключение уже влияет на конечный файл: звук этой дорожки не попадёт в готовую спикерскую.\n\nПри этом сама исходная дорожка не удаляется. Если решение изменится, её в любой момент можно снова вернуть в финальный микс.\n\nВ режиме «Анонс-мейкер» ненужную дорожку мы просто убирали из числа доступных дорожек. В «Спикерской» она остаётся частью проекта, но её можно включать или исключать из конечной записи.",
      "pronunciation_dictionary_locators": []
    },
    {
      "id": "B08",
      "title": "Спикерская: рабочая область",
      "canonical_start_offset": 8850,
      "canonical_end_offset": 10284,
      "scene_ids": [
        "B08-023",
        "B08-024",
        "B08-025",
        "B08-026",
        "B08-027"
      ],
      "narration": "Все дорожки расположены на общей временной шкале и синхронизированы между собой по времени.\n\nДля удобства работы каждой дорожке можно назначить свой цвет, а также изменить порядок их расположения на экране. Это не изменяет их положение во времени и не нарушает синхронизацию.\n\nПри необходимости рабочую область можно развернуть на весь экран.\n\nДля более точной работы с записью можно изменять горизонтальный масштаб временной шкалы: увеличить его, чтобы подробнее рассмотреть небольшой участок, или уменьшить, чтобы увидеть большую часть записи.\n\nКнопка «Вписать» возвращает всю запись в доступную ширину.\n\nЭтот же регулятор можно переключить в режим изменения высоты дорожек. Это удобно, если нужно разместить на экране больше дорожек одновременно или, наоборот, сделать их крупнее.\n\nПри минимальной высоте дорожек часть элементов управления скрывается, чтобы освободить место на экране. В частности, становятся скрыты ползунок компрессии и индикаторы уровня громкости. При увеличении высоты дорожек эти элементы снова отображаются.\n\nПри включённой функции Follow экран автоматически перемещается вслед за текущим местом воспроизведения.\n\nА функция Loop позволяет выделить нужный участок и прослушивать его по кругу. Это удобно, когда один и тот же фрагмент нужно несколько раз проверить перед редактированием.\n\nВсе эти функции предназначены для удобства просмотра и прослушивания записи и сами по себе не изменяют готовый аудиофайл.",
      "pronunciation_dictionary_locators": []
    },
    {
