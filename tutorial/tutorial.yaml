    {
      "id": "B03",
      "title": "Выбор источника файлов",
      "canonical_start_offset": 4281,
      "canonical_end_offset": 4767,
      "scene_ids": [
        "B03-008",
        "B03-009"
      ],
      "narration": "Итак, у нас имеется запись собрания в виде отдельных дорожек для каждого участника.\n\nМы их можем взять с того устройства, на котором производилась запись (например, тот самый компьютер, где запись была активирована), либо из облачного хранилища Zoom, доступного для владельца учётной записи.\n\nЕсли же кто-то до вас уже загрузил запись в Аудиоархив на портале Мэсэр, вы можете воспользоваться ей без надобности самим загружать файлы. Этот вариант будет подробнее показан в третьей части.",
      "pronunciation_dictionary_locators": []
    },
    {
      "id": "B04",
      "title": "Два режима обработки",
      "canonical_start_offset": 4769,
      "canonical_end_offset": 4895,
      "scene_ids": [
        "B04-010"
      ],
      "narration": "После выбора дорожек нам доступны два режима: «Анонс-мейкер» или «Спикерская».\nДавайте сперва рассмотрим режим «Анонс-мейкер».",
      "pronunciation_dictionary_locators": []
