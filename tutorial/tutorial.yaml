      "narration": "Сохранить исходную запись в Аудиоархив можно не только непосредственно из самого Архива.\n\nЕсли работа уже была начата в Аудиоредакторе с файлами, находящимися на устройстве, там также доступна кнопка «Сохранить запись Zoom в аудиоархив».\n\nТаким образом, нет необходимости заранее решать, понадобится ли вам Архив. Можно начать обычную обработку локальных файлов, а при необходимости сохранить исходную запись в Архив уже в процессе работы.\n\nРаботает это и в обратную сторону.\n\nУже сохранённую запись можно открыть в Аудиоредакторе прямо из Аудиоархива.\n\nДля этого нужно открыть нужную запись. В разделе «Что сделать с этой записью?» доступны два варианта: подготовить её для анонса или обработать спикерскую.\n\nКнопка «Открыть анонс-мейкер» открывает эту запись в соответствующем режиме Аудиоредактора.\n\nДля спикерской, если проект обработки ещё не создавался, используется «Начать обработку». Если же сохранённый проект уже существует, вместо этого будет предложено «Продолжить обработку».\n\nЕсть и другой путь: находясь непосредственно в Аудиоредакторе, можно выбрать вариант «Из аудиоархива», найти нужную запись и открыть её оттуда.\n\nВ обоих случаях используются сохранённые в Архиве исходные дорожки, поэтому повторно загружать их с устройства не требуется.",
