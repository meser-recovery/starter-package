        ],
        "captions": []
      },
      "narration": "Как вам известно, мы записываем спикерские собрания. Готовые записи затем добавляются на сайт «Нам по пути», а также используются анонс-мейкером, который прослушивает спикерскую и готовит по ней краткое текстовое резюме для анонса.",
      "visual": {
        "type": "animation",
        "goal": "Название ролика → карточка спикерской → сайт → текстовый анонс",
        "animation": "intro-purpose",
        "action": null
      },
      "initial_state": "blank-canvas",
      "expected_state": "Что мы вообще делаем",
      "assertions": [
        "animation-visible"
      ],
      "fixture_set": null,
      "dependencies": [],
      "regenerate": "on-hash-change",
      "padding": {
        "head": 0.5,
        "tail": 0.8
      },
      "target_seconds": "20–25 сек",
