          {"after_offset": 563, "reason": "Объяснение двух форматов записи и их синхронизации завершено; далее начинаются практические преимущества отдельных дорожек."},
          {"after_offset": 1217, "reason": "Показано использование одной языковой дорожки для анонса; далее начинается задача подготовки финальной спикерской."},
          {"after_offset": 1664, "reason": "Завершено объяснение сложности исправления общего файла; далее показано, что можно сделать на отдельной дорожке."},
          {"after_offset": 1924, "reason": "Закончены локальные действия с отдельным участником; далее разбирается проблема общего временного участка."},
          {"after_offset": 2137, "reason": "Объяснено одновременное удаление общего проблемного участка; далее следует итог о назначении двух инструментов."}
