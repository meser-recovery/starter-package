<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meser · module explanatory visuals 001–060</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff4f9;color:#112a3b;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:auto;max-height:100vh;object-fit:contain}nav{padding:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:8px}input{width:35vw}body.capture nav{display:none}
</style>
<canvas id="stage" width="1920" height="1080" role="img" aria-label="Анимированное объяснение обработки отдельных аудиодорожек"></canvas>
<nav aria-label="Просмотр анимации"><label>Сцена <select id="scene"><option value="001">001 · Вступление</option><option value="002">002 · Поканальная запись</option><option value="003">003 · Материал для анонса</option><option value="004">004 · Обработка спикерской</option></select></label><button id="play" type="button">Воспроизвести</button><label>Ход сцены <input id="progress" type="range" min="0" max="1" value="0" step="0.001"></label></nav>
<script>
'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{alpha:false});
const C={bg:'#f1f5fa',ink:'#102d40',muted:'#657b8e',line:'#d5e1eb',blue:'#087df1',teal:'#008b83',gold:'#bd7611',red:'#c75157',white:'#fff'};
const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)},ramp=(p,a,b)=>smooth((p-a)/(b-a)),mix=(a,b,t)=>a+(b-a)*t;
function text(s,x,y,size=30,color=C.ink,weight=400,align='left'){ctx.fillStyle=color;ctx.font=`${weight} ${size}px Arial`;ctx.textAlign=align;ctx.fillText(s,x,y);ctx.textAlign='left'}
function line(x,y,x2,y2,color=C.line,width=2){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function box(x,y,w,h,r=18,fill=C.white,stroke=null){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function circle(x,y,r,fill,stroke=null){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}}
function alpha(a,fn){ctx.save();ctx.globalAlpha*=clamp(a);fn();ctx.restore()}
function transformed(x,y,scale,fn){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);fn();ctx.restore()}
function check(x,y,color=C.teal){line(x-10,y,x,y+10,color,5);line(x,y+10,x+22,y-16,color,5)}
function play(x,y,s,color=C.blue){ctx.beginPath();ctx.moveTo(x-s*.35,y-s*.55);ctx.lineTo(x+s*.6,y);ctx.lineTo(x-s*.35,y+s*.55);ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function person(x,y,color,scale=1){circle(x,y-18*scale,16*scale,color);ctx.beginPath();ctx.arc(x,y+27*scale,29*scale,Math.PI,0);ctx.fillStyle=color;ctx.fill()}
function headphones(x,y,color){ctx.beginPath();ctx.arc(x,y,32,Math.PI,0);ctx.strokeStyle=color;ctx.lineWidth=6;ctx.stroke();box(x-38,y-4,12,32,5,color);box(x+26,y-4,12,32,5,color)}
function file(x,y,color,label='',scale=1){transformed(x,y,scale,()=>{box(-50,-70,100,140,9,C.white,C.line);ctx.beginPath();ctx.moveTo(24,-70);ctx.lineTo(50,-44);ctx.lineTo(24,-44);ctx.closePath();ctx.fillStyle=C.line;ctx.fill();for(let i=0;i<12;i++){let h=7+Math.abs(Math.sin(i*1.81))*19;line(-34+i*6,-8-h,-34+i*6,-8+h,color,3)}if(label)text(label,0,50,19,color,700,'center')})}

function base(num,label){ctx.fillStyle=C.bg;ctx.fillRect(0,0,1920,1080);text('Мэсэр',94,86,33,C.ink,700);text('АУДИОПОРТАЛ',94,119,15,C.muted,700);line(94,152,1826,152);text(label,94,228,46,C.ink,700);text(num+' / 60',1826,94,22,C.muted,400,'right');line(94,985,1826,985);text('Спикер',124,1030,23,C.blue);circle(102,1022,5,C.blue);text('Переводчик',298,1030,23,C.teal);circle(276,1022,5,C.teal);text('Участник',531,1030,23,C.gold);circle(509,1022,5,C.gold)}
const intervals=[[[.025,.17],[.31,.47],[.62,.78]],[[.18,.29],[.48,.61],[.8,.965]],[[.09,.14],[.39,.42],[.67,.7],[.88,.9]]];
function signal(t,track){let envelope=0;for(const [a,b] of intervals[track]){if(t>a&&t<b){const u=(t-a)/(b-a);envelope=Math.max(envelope,Math.min(1,u*14,(1-u)*14))}}return envelope*(.28+.42*Math.abs(Math.sin(t*173+track*6))+.3*Math.abs(Math.sin(t*491+track)))}
function wave(x,y,w,h,track,color,options={}){const {gain=1,hum=0,noise=0,exclude=0,cut=0,trim=0,mute=0}=options;ctx.save();ctx.globalAlpha*=1-exclude;line(x,y,x+w*(1-.12*cut),y,C.line,2);ctx.beginPath();for(let i=0;i<250;i++){const t=i/249;if(trim&&(t<.055*trim||t>1-.04*trim))continue;if(cut&&t>.43&&t<.55)continue;let mapped=t;if(t>=.55)mapped-=.12*cut;let amp=signal(t,track)*gain;if(hum)amp+=hum*(.12+.07*Math.abs(Math.sin(t*280)));if(noise&&t>.725&&t<.765)amp+=noise*.95*Math.sin((t-.725)/.04*Math.PI);if(mute&&t>.716&&t<.775)amp*=1-mute;let ah=Math.max(1,amp*h/2);ctx.moveTo(x+mapped*w,y-ah);ctx.lineTo(x+mapped*w,y+ah)}ctx.strokeStyle=color;ctx.lineWidth=Math.max(2,w/250*.62);ctx.stroke();ctx.restore()}
function axis(x,y,w,h=440){for(let i=0;i<=8;i++){let xx=x+w*i/8;line(xx,y,xx,y+h,C.line,1);text(i===0?'0':`${i*10} c`,xx,y-18,21,C.muted,400,'center')}line(x,y,x+w,y,C.muted,2)}
function intro(p){base('01','От записи собрания — к материалу для служения');const greet=1-ramp(p,.23,.33);alpha(greet,()=>{text('Мэсэр',960,470,114,C.ink,700,'center');text('Новые возможности для служащих',960,554,35,C.muted,400,'center');for(let i=0;i<43;i++){const h=(.3+.7*Math.abs(Math.sin(i*.56)))*62;line(660+i*14,695-h,660+i*14,695+h,[C.blue,C.teal,C.gold][Math.floor(i/15)%3],6)}});
alpha(1-greet,()=>{const spread=ramp(p,.48,.72);const recX=mix(960,470,spread);circle(recX,575,138,'#e2edf7');circle(recX,575,98,C.white,C.line);circle(recX,575,30,C.blue);circle(recX,575,8,C.white);for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(recX,575,63+i*11,.1,2.5);ctx.strokeStyle='#b0cce4';ctx.lineWidth=2;ctx.stroke()}
text('Запись собрания',recX,781,29,C.ink,700,'center');person(recX-80,365,C.blue);person(recX,342,C.teal);person(recX+80,365,C.gold);alpha(spread,()=>{headphones(980,480,C.blue);text('Спикерская · для слушателей',1030,378,28,C.ink,600);wave(1060,480,490,92,0,C.blue);const a=ramp(p,.72,.93);alpha(a,()=>{box(1020,650,510,240,15,C.white,C.line);text('Анонс',1062,704,28,C.ink,700);for(let i=0;i<4;i++)line(1062,745+i*30,1442-(i%2)*90,745+i*30,'#a5b8c9',7);headphones(954,750,C.teal)})});for(let i=0;i<5;i++){const q=(p*2+i/5)%1;alpha(spread*.5,()=>circle(mix(recX+155,930,q),mix(575,480,q),4,C.blue))}})}
function multitrack(p){base('02','Одна запись. Несколько голосов.');const split=ramp(p,.28,.58),x=392,w=1280;axis(x,365,w,480);alpha(1-split,()=>text('Zoom · общая запись',x,320,27,C.ink,700));const colors=[C.blue,C.teal,C.gold],names=['Спикер','Переводчик','Участник'];for(let n=0;n<3;n++){let y=mix(600,455+n*165,split);wave(x,y,w,mix(190,118,split),n,colors[n]);alpha(split,()=>{person(162,y,colors[n],.8);text(names[n],205,y+10,26,colors[n],700)})}alpha(split,()=>{text('Zoom · отдельные дорожки',x,320,27,C.ink,700);line(1750,435,1750,805,C.muted,3);line(1738,435,1750,435,C.muted,3);line(1738,805,1750,805,C.muted,3);text('Общее время',1032,916,25,C.muted,400,'center')});const playhead=x+w*(.12+.78*p);line(playhead,363,playhead,850,C.ink,2);circle(playhead,356,6,C.ink)}
function announcement(p){base('03','Короткий материал для анонс-мейкера');const isolate=ramp(p,.32,.5),compress=ramp(p,.61,.86),x=375,w=1310;alpha(1-isolate,()=>{text('Спикер',112,464,27,C.blue,700);wave(x,452,w,136,0,C.blue)});const y=mix(686,536,isolate);text('Русский перевод',112,y+10,27,C.teal,700);axis(x,335,w,440);wave(x,452,w,100,0,C.blue,{exclude:isolate});alpha(isolate*.3,()=>wave(x,390,w,45,1,C.teal));
const gaps=[[0,.18],[.29,.48],[.61,.8],[.965,1]];const removed=t=>gaps.reduce((sum,[a,b])=>sum+Math.max(0,Math.min(t,b)-a),0);const map=t=>t-removed(t)*compress*.94;const end=map(1);line(x,y,x+w*end,y,C.line,2);
for(const [a,b] of gaps){const gx=x+map(a)*w,gw=(map(b)-map(a))*w;alpha(isolate*(1-compress),()=>{box(gx,y-84,gw,168,0,'#f4e2e4');for(let k=8;k<gw;k+=22)line(gx+k,y-70,gx+Math.min(gw,k+18),y+70,'#ddb0b4',2)})}
ctx.beginPath();for(let i=0;i<280;i++){let t=i/279,amp=signal(t,1)*65;ctx.moveTo(x+map(t)*w,y-amp);ctx.lineTo(x+map(t)*w,y+amp)}ctx.strokeStyle=C.teal;ctx.lineWidth=3;ctx.stroke();line(x,830,x+w,830,C.line,9);line(x,830,x+w*end,830,C.teal,9);circle(x+w*end,830,11,C.teal);text('Длина записи',112,839,27,C.muted);alpha(ramp(p,.53,.6)*(1-ramp(p,.82,.9)),()=>text('Паузы',x+w*.38,y+133,25,C.red,700));alpha(compress,()=>{headphones(x+w*end+100,y,C.teal);check(x+w*end+100,y+70);text('Готово к прослушиванию',x,916,27,C.teal,700)})}
function edits(p){base('04','Каждый голос можно обработать отдельно');const x=410,w=1250,ys=[433,605,777],normal=ramp(p,.25,.32),clean=ramp(p,.35,.44),mute=ramp(p,.51,.59),exclude=ramp(p,.68,.75),cut=ramp(p,.82,.88),trim=ramp(p,.94,.985);axis(x,334,w,526);const colors=[C.blue,C.teal,C.gold],names=['Спикер','Переводчик','Участник'];
for(let i=0;i<3;i++){alpha(i===2?1-exclude*.72:1,()=>{person(133,ys[i],colors[i],.75);text(names[i],179,ys[i]+8,26,colors[i],700)});wave(x,ys[i],w,110,i,colors[i],{gain:i===0?mix(.25,1,normal):1,hum:i===1?1-clean:0,noise:i===1?1-mute:0,mute:i===1?mute:0,exclude:i===2?exclude*.94:0,cut,trim});}
let label='Разная громкость · фон · помехи',highlight=-1;if(p>=.25&&p<.35){label='Выравнивание громкости';highlight=0;alpha(1-normal,()=>wave(x,433,w,110,0,'#a0b6c7',{gain:1}));line(1705,468,1705,398,C.blue,4);line(1693,411,1705,398,C.blue,4);line(1717,411,1705,398,C.blue,4)}else if(p>=.35&&p<.46){label='Уменьшение гула';highlight=1}else if(p>=.46&&p<.65){label='Локальная помеха → тишина';highlight=1;box(x+w*.716,529,w*.059,152,4,'#c751571d',C.red);alpha(mute,()=>check(x+w*.745,503));}else if(p>=.65&&p<.79){label='Исключение ненужного участника';highlight=2;alpha(exclude,()=>{line(115,751,150,797,C.red,4);line(150,751,115,797,C.red,4)})}else if(p>=.79&&p<.91){label='Общий фрагмент · синхронный вырез';const a=x+w*.43,b=x+w*(.55-.12*cut);alpha(1-cut,()=>box(a,365,b-a,465,2,'#c7515720'));line(a,355,a,845,C.red,3);line(b,355,b,845,C.red,3);}else if(p>=.91){label='Точные начало и конец';const a=x+w*.055*trim,b=x+w*(1-.12*cut-.04*trim);box(x,355,a-x,500,0,'#f1f5faaf');box(b,355,x+w-b,500,0,'#f1f5faaf');line(a,352,a,860,C.teal,4);line(b,352,b,860,C.teal,4);box(a-7,350,14,24,4,C.teal);box(b-7,350,14,24,4,C.teal);}
if(highlight>=0){line(x-28,ys[highlight]-65,x-28,ys[highlight]+65,colors[highlight],5);for(let i=0;i<3;i++)if(i!==highlight&&!(i===2&&exclude>.8))check(1740,ys[i],C.muted)}text(label,960,925,31,C.ink,700,'center');}
function recordFolder(x,y,sources,results,p){circle(x,y,196,'#e0edf9');ctx.beginPath();ctx.moveTo(x-146,y-104);ctx.lineTo(x-57,y-104);ctx.lineTo(x-31,y-77);ctx.lineTo(x+146,y-77);ctx.lineTo(x+146,y+118);ctx.lineTo(x-146,y+118);ctx.closePath();ctx.fillStyle='#c5ddf3';ctx.fill();for(let i=0;i<3;i++)alpha(sources,()=>file(x-76+i*76,y+1,[C.blue,C.teal,C.gold][i],'',.65));box(x-152,y+63,304,79,12,'#9cc7ed');text('Запись 01',x,y+113,27,C.ink,700,'center');alpha(results,()=>{circle(x-88,y+196,31,C.white,C.teal);for(let j=0;j<3;j++){line(x-105,y+184+j*12,x-71,y+184+j*12,C.teal,3);circle(x-96+(j%2)*17,y+184+j*12,4,C.teal)}circle(x+25,y+196,31,C.white,C.blue);play(x+25,y+196,23,C.blue);circle(x+123,y+196,31,C.white,C.gold);play(x+123,y+196,23,C.gold);text('Проект',x-90,y+259,21,C.muted,400,'center');text('Готовые версии',x+86,y+259,21,C.muted,400,'center')})}

const renderers={'001':intro,'002':multitrack,'003':announcement,'004':edits};
window.renderFrame=(scene,progress)=>{if(!renderers[scene])throw Error('Unsupported pilot scene');renderers[scene](clamp(progress));};
let transitionImage; window.setTransition=async data=>{transitionImage=new Image();transitionImage.src=data;await transitionImage.decode()};
window.frameJpeg=(scene,progress,blend=0)=>{window.renderFrame(scene,progress);if(blend&&transitionImage)alpha(blend,()=>ctx.drawImage(transitionImage,0,0,1920,1080));return canvas.toDataURL('image/jpeg',.91).split(',')[1]};
const params=new URLSearchParams(location.search);if(params.has('capture'))document.body.classList.add('capture');let selected=params.get('scene')||'002',p=Number(params.get('p')||0);document.querySelector('#scene').value=selected;document.querySelector('#progress').value=p;if(renderers[selected])window.renderFrame(selected,p);
document.querySelector('#scene').onchange=e=>{selected=e.target.value;p=0;document.querySelector('#progress').value=p;window.renderFrame(selected,p)};document.querySelector('#progress').oninput=e=>{p=Number(e.target.value);window.renderFrame(selected,p)};let playing=false,last=0;document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Пауза':'Воспроизвести';last=performance.now();if(p===1)p=0};function tick(t){if(playing){p=Math.min(1,p+(t-last)/24000);document.querySelector('#progress').value=p;window.renderFrame(selected,p);if(p===1){playing=false;document.querySelector('#play').textContent='Воспроизвести'}}last=t;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script>
<script src="module-visuals.js"></script>
