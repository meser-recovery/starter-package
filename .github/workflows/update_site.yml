name: Build NA HTML daily

on:
  schedule:
    # Каждый день в 21:00 UTC = 00:00 по Москве
    - cron: "0 21 * * *"
    # Резервные попытки на новых runners; полный список за день не пересобирается.
    - cron: "17 22,23 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/update_site.yml
      - build_na_html.py
      - tests/test_build_na_html.py
      - requirements.txt

permissions:
  contents: read

concurrency:
  group: na-meetings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_build_na_html.py -v

  build-and-commit:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run build script
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            python -u build_na_html.py --skip-if-current
          else
            python -u build_na_html.py
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add na_meetings_live.html
          if git diff --cached --quiet; then
            echo "No changes detected, nothing to commit."
            exit 0
          fi
          git commit -m "Auto-update NA meetings HTML [skip ci]"
          for attempt in 1 2 3; do
            if git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          echo "Could not publish meeting list after 3 attempts."
          exit 1
