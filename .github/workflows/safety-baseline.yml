name: Safety baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"

permissions:
  contents: read
  pages: read

jobs:
  local-safety:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.7.0'
      - name: Check repository contract
        run: python3 tests/safety/check_site.py
      - name: Check gateway syntax
        run: npm --prefix gateway/audio-archive run check
      - name: Run gateway test suite
        run: npm --prefix gateway/audio-archive test
      - name: Run frontend Node safety suite
        run: node --test tests/safety/*.test.mjs
      - name: Install browser test dependency
        run: pip install -r requirements-test.txt
      - name: Install Chromium, Firefox and WebKit
        run: python3 -m playwright install --with-deps chromium firefox webkit
      - name: Run local browser smoke suite
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/site-server.log 2>&1 &
          server_pid=$!
          node tests/safety/s10a_preview_server.mjs 4173 http://localhost:4173 >/tmp/service-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$server_pid" "$preview_pid"' EXIT
          python3 tests/safety/browser_smoke.py --base-url http://127.0.0.1:8000
          python3 tests/safety/s10a_browser_smoke.py --base-url http://localhost:4173 --browser all
          python3 tests/safety/s10a_ui_corrective_smoke.py --base-url http://localhost:4173 --browser all
          python3 tests/safety/s10a_mobile_waveform_smoke.py --base-url http://127.0.0.1:8000 --browser all
      - name: Verify protected frontend inventory and script syntax
        run: |
          node service/tools/verify-frontend.mjs
          bash -n service/tools/*.sh gateway/audio-archive/deploy/s10a/*.sh gateway/audio-archive/deploy/recovery/*.sh
          base_sha="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base_sha" ]; then base_sha=$(git merge-base origin/main HEAD); fi
          git diff --check "$base_sha...HEAD"
      - name: Prove deterministic source packaging twice
        run: |
          first=$(mktemp -d)
          second=$(mktemp -d)
          source_sha=$(git rev-parse HEAD)
          service/tools/package-reviewed-service.sh "$source_sha" "$first"
          service/tools/package-reviewed-service.sh "$source_sha" "$second"
          cmp "$first/meser-service-s10a-$source_sha.tar.gz" "$second/meser-service-s10a-$source_sha.tar.gz"
          artifact_sha=$(sha256sum "$first/meser-service-s10a-$source_sha.tar.gz" | awk '{print $1}')
          test "$artifact_sha" = "$(sha256sum "$second/meser-service-s10a-$source_sha.tar.gz" | awk '{print $1}')"
          printf 'SOURCE_ARTIFACT_SHA256=%s\n' "$artifact_sha"
          printf 'Exact-HEAD source artifact SHA-256: `%s`\n' "$artifact_sha" >>"$GITHUB_STEP_SUMMARY"
      - name: Validate same-origin Compose and pinned Caddy configuration
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATEWAY_IMAGE: meser-service-gateway:${{ github.event.pull_request.head.sha || github.sha }}
          CADDY_IMAGE: meser-service-caddy:${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_APP_ID: validation-only
          GITHUB_APP_INSTALLATION_ID: validation-only
        run: |
          docker compose -f gateway/audio-archive/deploy/self-hosted/compose.yaml config >/tmp/meser-compose.yaml
          docker run --rm \
            -v "$PWD/gateway/audio-archive/deploy/self-hosted/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e \
            caddy validate --config /etc/caddy/Caddyfile
          docker compose -f gateway/audio-archive/deploy/self-hosted/compose.yaml build gateway caddy
          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$GATEWAY_IMAGE")" = "$SOURCE_SHA"
          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$CADDY_IMAGE")" = "$SOURCE_SHA"
      - name: Synthetic encrypted recovery rehearsal
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          gateway/audio-archive/deploy/recovery/synthetic-recovery-rehearsal.sh
      - name: Synthetic Docker rollback, clean restore and Caddy runtime rehearsal
        run: gateway/audio-archive/deploy/recovery/synthetic-docker-restore-rehearsal.sh

  production-safety:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Wait for the matching Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 40); do
            page_json=$(gh api "repos/${GITHUB_REPOSITORY}/pages") || exit 1
            build_json=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest") || exit 1
            build_status=$(printf '%s' "$build_json" | jq -r '.status')
            build_sha=$(printf '%s' "$build_json" | jq -r '.commit')
            if [ "$build_status" = built ] && [ "$build_sha" = "$EXPECTED_SHA" ]; then
              break
            fi
            if [ "$build_status" = errored ]; then
              echo "GitHub Pages build failed for commit $build_sha"
              exit 1
            fi
            sleep 15
          done
          if [ "$build_status" != built ]; then
            echo "Timed out waiting for a healthy GitHub Pages build"
            exit 1
          fi
          if [ "$build_sha" != "$EXPECTED_SHA" ]; then
            echo "Expected Pages build for $EXPECTED_SHA; latest healthy build is $build_sha"
            exit 1
          fi
          printf '%s' "$page_json" | jq -r '.html_url' > pages-url.txt
      - name: Check deployed URL contract
        run: python3 tests/safety/check_site.py --base-url "$(cat pages-url.txt)"
      - name: Install browser test dependency
        run: pip install -r requirements-test.txt
      - name: Install Chromium
        run: python3 -m playwright install --with-deps chromium
      - name: Run deployed browser smoke suite
        run: python3 tests/safety/browser_smoke.py --base-url "$(cat pages-url.txt)"
