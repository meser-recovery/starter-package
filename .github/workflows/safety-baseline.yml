# ISOLATED BRANCH VERSION ONLY. Never merge this replacement into main.
name: Safety baseline
run-name: S12 public Linux proof ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s12-public-linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  s12-public-linux-dummy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      S12_CI_ENABLE: "true"
      S12_RUNNER_ENVIRONMENT: ${{ runner.environment }}
    steps:
      - name: Ref and single-attempt guard before checkout
        timeout-minutes: 1
        shell: bash
        run: |
          python3 -B - <<'PUBLIC_GUARD'
          import hashlib,json,os,re
          from pathlib import Path
          c=lambda k:os.environ.get(k,'')
          ref=c('GITHUB_REF');sha=c('GITHUB_SHA')
          ok=(c('S12_CI_ENABLE')=='true' and c('GITHUB_REPOSITORY')=='meser-recovery/starter-package'
            and c('GITHUB_REPOSITORY_ID')=='1097646215' and c('GITHUB_EVENT_NAME')=='workflow_dispatch'
            and re.fullmatch('refs/heads/codex/s12-public-linux-ci-r1/[0-9a-f]{40}',ref)
            and re.fullmatch('[0-9a-f]{40}',sha) and c('GITHUB_WORKFLOW_SHA')==sha
            and c('GITHUB_WORKFLOW_REF')=='meser-recovery/starter-package/.github/workflows/safety-baseline.yml@'+ref
            and c('GITHUB_RUN_ATTEMPT')=='1' and c('RUNNER_OS')=='Linux' and c('RUNNER_ARCH')=='X64'
            and c('S12_RUNNER_ENVIRONMENT')=='github-hosted')
          if not ok:
            p=Path('ci-public-evidence');p.mkdir(mode=0o700,exist_ok=True)
            b=(json.dumps({'schema':'s12-public-linux-proof-v1','status':'BLOCKED','exit_status':78,
              'code':'DISABLED_OR_REF_ATTEMPT_GUARD','kernel_live':'NOT RUN'},sort_keys=True)+'\n').encode()
            (p/'report.json').write_bytes(b);(p/'SHA256SUMS').write_text(hashlib.sha256(b).hexdigest()+'  report.json\n')
            raise SystemExit(78)
          PUBLIC_GUARD
      - name: Checkout exact event commit with public sparse paths
        timeout-minutes: 2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/safety-baseline.yml
            tests/safety/s12-public-linux-ci
      - name: Verify public inputs and run exactly one unchanged dummy harness
        timeout-minutes: 4
        shell: bash
        run: exec python3 -B tests/safety/s12-public-linux-ci/collect.py
      - name: Upload only sanitized report and its checksum
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s12-public-linux-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ci-public-evidence/report.json
            ci-public-evidence/SHA256SUMS
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 7
