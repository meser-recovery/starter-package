global
    log /dev/log local0
    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend public_tls_443
    bind :443
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    acl meser_gateway_sni req.ssl_sni -i meserproject.duckdns.org
    use_backend caddy_tls if meser_gateway_sni
    default_backend xray_reality

backend caddy_tls
    mode tcp
    server caddy_loopback 127.0.0.1:9443 send-proxy-v2 check

backend xray_reality
    mode tcp
    server xray_loopback 127.0.0.1:9444 check
