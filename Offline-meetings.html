<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#478ac9">
    <title>Живые группы АН — Россия — Проект Мэсэр</title>
    <link rel="stylesheet" href="styles/foundation.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/offline-meetings.css">
    <script src="scripts/offline-meetings.js" defer></script>
  </head>
  <body class="site-page">
    <a class="skip-link" href="#main-content">Перейти к основному содержимому</a>
    <header class="site-header">
      <div class="container site-header__content">
        <a class="site-header__logo" href="./" aria-label="На главную">
          <img src="images/NALogo.png" alt="Логотип АН" width="52" height="52">
        </a>
        <a class="site-header__title site-header__identity" href="./">Проект Мэсэр</a>
        <a class="service-link" href="Admin-panel.html" aria-label="Для служащих"><span>Для</span><span>служащих</span></a>
      </div>
    </header>
    <main id="main-content" class="offline-meetings-main">
      <div class="container offline-meetings-content">
        <h1>Живые группы АН - Россия</h1>
        <p id="meetings-date" class="meetings-date" hidden></p>
        <div class="offline-filter">
          <label for="cityFilter">Город</label>
          <select id="cityFilter">
            <option value="" selected disabled hidden>Выберите город</option>
            <option value="all">Все города</option>
          </select>
        </div>
        <section class="na-meetings" aria-label="Расписание живых групп">
          <p id="na-loading" role="status" aria-live="polite">Загружаем данные…</p>
          <div id="meetings-content"></div>
        </section>
      </div>
    </main>
    <footer class="site-footer">
      <div class="container">
        <p>Горячая линия АН, где вы можете получить поддержку и любую информацию, связанную с выздоровлением и сообществом.<br>Единый номер: 8 (800) 101-42-12<br>Круглосуточно, бесплатно для звонков по РФ</p>
      </div>
    </footer>
  </body>
</html>
